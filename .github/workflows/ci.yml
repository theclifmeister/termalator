name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet (go vet, staticcheck)
        run: make vet

      - name: test
        run: make test

      - name: selftest
        run: ./bin/tm selftest

  # End-to-end smoke set (internal/e2e TestSmoke*), beside build rather
  # than after it, in shards (scripts/e2e-shard.sh). Without -race: a
  # race-built tm starts slowly and every agent hook starts one. The
  # race-built smoke set runs nightly (nightly.yml).
  e2e-smoke:
    name: e2e smoke (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Shard I of 2: change the /2 below with the list.
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: e2e smoke
        run: make e2e-smoke E2E_SHARD=${{ matrix.shard }}/2
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # Whether this event needs the release snapshot: every push (main CI is
  # what a release tag waits for), and pull requests that touch the
  # release build. The snapshot job is skipped otherwise; a job skipped by
  # its `if` counts as passed for required checks, unlike a workflow left
  # out by a paths filter, which would leave them pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      # A pull request checks out its merge commit, whose first parent is
      # the base: depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Release-related files
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          hits=$(printf '%s\n' "$files" | grep -E '^(\.goreleaser\.yaml|Makefile|go\.(mod|sum)|scripts/release/|Formula/|\.github/workflows/(ci|release)\.yml|\.github/actions/|internal/(emu|version)/|cmd/tm/main\.go)' || true)
          echo "release-related: ${hits:-none}"
          echo "release=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The release build (.goreleaser.yaml) as a snapshot: every target
  # cross-compiled with zig cc and archived, nothing tagged or uploaded.
  # macOS, like the release itself: darwin targets need the macOS SDK.
  release-snapshot:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pins
        id: pins
        run: |
          echo "zig=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          echo "ghostty=$({ grep -E '^(GHOSTTY_(REV|REPO|CPU)|ZIG_VERSION) ' Makefile; echo "$GITHUB_WORKSPACE"; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

      - name: Cache release libghostty-vt
        uses: actions/cache@v6
        with:
          path: |
            .build/release/ghostty-*
            !.build/release/ghostty-src
          key: ghostty-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}-${{ hashFiles('scripts/release/targets.sh') }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      - name: goreleaser check
        run: goreleaser check

      - name: release snapshot
        run: make release-snapshot

      - name: Check the archives
        run: scripts/release/check.sh dist

      # The formula the release job will write for these archives, through
      # Homebrew's own style check.
      - name: Formula
        run: |
          # In a Formula/ directory, or brew style checks it as plain Ruby.
          mkdir -p "$RUNNER_TEMP/Formula"
          scripts/release/formula.sh 0.0.0 dist/checksums.txt > "$RUNNER_TEMP/Formula/terminatr.rb"
          # One at a time: together they define the class twice.
          brew style "$RUNNER_TEMP/Formula/terminatr.rb"
          brew style Formula/terminatr.rb

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
