name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # No setup-zig: `make` fetches the pinned Zig into .build/ (sha256-
      # checked) unless a Zig 0.16 is already on PATH. Cached on its own,
      # keyed on the Zig pin in the Makefile.
      - name: Zig pin
        id: zig
        run: echo "key=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.key }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      # libghostty-vt only changes when GHOSTTY_REV in the Makefile changes.
      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          path: .build/ghostty-*
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: toolchain
        run: |
          make toolchain
          echo "zig on PATH: $(command -v zig || echo none)"

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: selftest
        run: ./bin/tm selftest

      # End-to-end smoke set (internal/e2e TestSmoke*), without -race: a
      # race-built tm starts slowly and every agent hook starts one. The
      # race-built smoke set runs nightly (nightly.yml).
      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
