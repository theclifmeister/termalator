name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      # libghostty-vt only changes when GHOSTTY_REV in the Makefile changes.
      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          path: .build/ghostty-*
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: selftest
        run: ./bin/tm selftest

      # End-to-end smoke set (internal/e2e TestSmoke*), tm built with -race.
      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
