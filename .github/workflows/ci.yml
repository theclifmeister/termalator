name: ci

# Lean by design (GitHub bills every job, rounded up to the minute):
#   pull request  one Linux job (`test`: gofmt, build, vet, cross-vet, unit
#                 tests, selftest, e2e smoke), plus claude-mod / release-snapshot when their
#                 files change. No macOS, no -race. Docs-only and site-only changes
#                 skip it.
#   push to main  the same Linux job with unit tests under -race (the e2e
#                 smoke stays race-free), and macOS (`macos`: build, unit
#                 tests, e2e smoke). Release tags wait for this.
# Slow checks (fuzzing, the full e2e suite, race-built smoke) run weekly:
# weekly.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight; main keeps
# running every commit, so each one has a result. GitHub keeps only one
# pending run per group, so main's group includes the sha: a newer pending
# run would otherwise cancel an older pending one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Without -race on pull requests: a race-built tm starts slowly and every
  # agent hook starts one, and unsharded on main it hit the go test timeout.
  # Main runs only the unit tests with -race (make test-race); the
  # race-built smoke set runs weekly (weekly.yml).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet (go vet, staticcheck)
        run: make vet

      # GOOS=windows, darwin and freebsd without cgo: seconds, no runner.
      - name: cross-vet (windows, darwin, freebsd)
        run: make vet-cross

      - name: test
        run: make ${{ github.event_name == 'push' && 'test-race' || 'test' }}

      - name: selftest
        run: ./bin/tm selftest

      # For TestSmokeCodexSandbox: the thread sandbox under Linux's
      # bubblewrap (T189). `codex sandbox` needs no login. Ubuntu 24.04
      # lets no unprivileged process map a user namespace, which bwrap
      # needs ("bwrap: setting up uid map: Permission denied").
      - name: codex
        run: |
          npm install -g @openai/codex@0.160.0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Internal/e2e TestSmoke*.
      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
          E2E_CODEX_SANDBOX: "1"

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-linux
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # macOS, on main only: it gates release tags (the release is built on
  # macOS) but a pull request never waits for it. No -race: Linux covers it.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: build
        run: make build

      - name: test
        run: make test

      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-macos
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # What this event needs. Each job is skipped otherwise; a job skipped by
  # its `if` counts as passed for required checks, unlike a workflow left
  # out by a paths filter, which would leave them pending.
  #   code     build and test: every push to main, and pull requests that
  #            change anything but *.md, docs/ and site/ (the website)
  #   release  the release snapshot: pull requests that touch the release
  #            build. Not main: a release tag runs it (release.yml).
  #   mod      the Claude mod check: every push, and pull requests that
  #            touch the mod or the Claude adapter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
      release: ${{ steps.release.outputs.release }}
      mod: ${{ steps.mod.outputs.mod }}
    steps:
      # A pull request checks out its merge commit, whose first parent is
      # the base: depth 2 is enough to diff the two.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Code changes (not only docs)
        id: code
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(git diff --name-only HEAD^1 HEAD | grep -vE "(\.md$|^docs/|^site/)" || true)
          echo "non-docs: ${hits:-none}"
          echo "code=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Release-related files
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          hits=$(printf '%s\n' "$files" | grep -E '^(\.goreleaser\.yaml|Makefile|go\.(mod|sum)|scripts/release/|Formula/|\.github/workflows/(ci|release)\.yml|\.github/actions/|internal/(emu|version)/|cmd/tm/main\.go)' || true)
          echo "release-related: ${hits:-none}"
          echo "release=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mod-related files
        id: mod
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "mod=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(git diff --name-only HEAD^1 HEAD | grep -E '^(internal/agent/claude/|internal/agent/manifests/claude\.toml$|\.github/workflows/ci\.yml$)' || true)
          echo "mod-related: ${hits:-none}"
          echo "mod=$([ -n "$hits" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # terminatr's mod for Claude (docs/SPEC.md §8.6, Mods): claude plugin
  # validate and claude plugin test on the plugin exactly as a session
  # gets it. A pinned Claude Code, no login, no secrets; both commands
  # work offline. Bump the pin together with ModsMinVersion
  # (internal/agent/claude/mod.go). Needs Go only, not libghostty.
  claude-mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.291
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # npm comes with the runner's Node.
      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: claude plugin validate / test
        run: go test -count=1 -run '^TestModPlugin$' -v ./internal/agent/claude
        env:
          TERMINATR_CLAUDE_PLUGIN_CHECK: "1"

  # The release build (.goreleaser.yaml) as a snapshot: every target
  # cross-compiled with zig cc and archived, nothing tagged or uploaded.
  # macOS, like the release itself: darwin targets need the macOS SDK.
  release-snapshot:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pins
        id: pins
        run: |
          echo "zig=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          echo "ghostty=$({ grep -E '^(GHOSTTY_(REV|REPO|CPU)|ZIG_VERSION) ' Makefile; echo "$GITHUB_WORKSPACE"; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

      - name: Cache release libghostty-vt
        uses: actions/cache@v6
        with:
          path: |
            .build/release/ghostty-*
            !.build/release/ghostty-src
          key: ghostty-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}-${{ hashFiles('scripts/release/targets.sh') }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      - name: goreleaser check
        run: goreleaser check

      - name: release snapshot
        run: make release-snapshot

      - name: Check the archives
        run: scripts/release/check.sh dist

      # The formula the release job will write for these archives, through
      # Homebrew's own style check.
      - name: Formula
        run: |
          # In a Formula/ directory, or brew style checks it as plain Ruby.
          mkdir -p "$RUNNER_TEMP/Formula"
          scripts/release/formula.sh 0.0.0 dist/checksums.txt > "$RUNNER_TEMP/Formula/terminatr.rb"
          # One at a time: together they define the class twice.
          brew style "$RUNNER_TEMP/Formula/terminatr.rb"
          brew style Formula/terminatr.rb

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
