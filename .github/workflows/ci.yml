name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # No setup-zig: `make` fetches the pinned Zig into .build/ (sha256-
      # checked) unless a Zig 0.16 is already on PATH. Cached on its own,
      # keyed on the Zig pin in the Makefile.
      - name: Zig pin
        id: zig
        run: echo "key=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.key }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      # libghostty-vt only changes with the Ghostty pin (and the Zig that
      # builds it), so its cache is keyed on those lines alone: other
      # Makefile edits don't force a rebuild. The checkout path is in the
      # key too: the build's pkg-config files name their absolute prefix,
      # which moved when the repository was renamed.
      - name: Ghostty pin
        id: ghostty
        run: echo "key=$({ grep -E '^(GHOSTTY_(REV|REPO|CPU)|ZIG_VERSION) ' Makefile; echo "$GITHUB_WORKSPACE"; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          path: .build/ghostty-*
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty.outputs.key }}

      - name: toolchain
        run: |
          make toolchain
          echo "zig on PATH: $(command -v zig || echo none)"

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        run: make build

      - name: vet (go vet, staticcheck)
        run: make vet

      - name: test
        run: make test

      - name: selftest
        run: ./bin/tm selftest

      # End-to-end smoke set (internal/e2e TestSmoke*), without -race: a
      # race-built tm starts slowly and every agent hook starts one. The
      # race-built smoke set runs nightly (nightly.yml).
      - name: e2e smoke
        run: make e2e-smoke
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # terminatr's mod for Claude (docs/SPEC.md §8.6, Mods): claude plugin
  # validate and claude plugin test on the plugin exactly as a session
  # gets it. A pinned Claude Code, no login, no secrets; both commands
  # work offline. Bump the pin together with ModsMinVersion
  # (internal/agent/claude/mod.go). On every push to main, and on PRs
  # that touch the mod, the Claude adapter or this workflow; the job
  # always runs and skips its steps otherwise, so the check never blocks
  # a merge by being skipped.
  claude-mod:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.291
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          if echo "$files" | grep -qE '^(internal/agent/claude/|internal/agent/manifests/claude\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing of the mod changed: skipping."
          fi

      - uses: actions/setup-go@v7
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod

      # npm comes with the runner's Node.
      - name: Install Claude Code
        if: steps.changed.outputs.run == 'true'
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: claude plugin validate / test
        if: steps.changed.outputs.run == 'true'
        run: go test -count=1 -run '^TestModPlugin$' -v ./internal/agent/claude
        env:
          TERMINATR_CLAUDE_PLUGIN_CHECK: "1"

  # The release build (.goreleaser.yaml) as a snapshot: every target
  # cross-compiled with zig cc and archived, nothing tagged or uploaded.
  # macOS, like the release itself: darwin targets need the macOS SDK.
  release-snapshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pins
        id: pins
        run: |
          echo "zig=$(grep -E '^ZIG_(VERSION|SHA256_)' Makefile | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          echo "ghostty=$({ grep -E '^(GHOSTTY_(REV|REPO|CPU)|ZIG_VERSION) ' Makefile; echo "$GITHUB_WORKSPACE"; } | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: .build/zig-*
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.zig }}

      - name: Cache release libghostty-vt
        uses: actions/cache@v6
        with:
          path: |
            .build/release/ghostty-*
            !.build/release/ghostty-src
          key: ghostty-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.ghostty }}-${{ hashFiles('scripts/release/targets.sh') }}

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      - name: goreleaser check
        run: goreleaser check

      - name: release snapshot
        run: make release-snapshot

      - name: Check the archives
        run: scripts/release/check.sh dist

      # The formula the release job will write for these archives, through
      # Homebrew's own style check.
      - name: Formula
        run: |
          # In a Formula/ directory, or brew style checks it as plain Ruby.
          mkdir -p "$RUNNER_TEMP/Formula"
          scripts/release/formula.sh 0.0.0 dist/checksums.txt > "$RUNNER_TEMP/Formula/terminatr.rb"
          # One at a time: together they define the class twice.
          brew style "$RUNNER_TEMP/Formula/terminatr.rb"
          brew style Formula/terminatr.rb

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7
