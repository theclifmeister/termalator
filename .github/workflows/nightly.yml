name: nightly

# Slow checks that don't run on every PR (docs/SPEC.md §16): long fuzzing
# and the full end-to-end suite.
# Real-Claude tests need a logged-in claude: see the realclaude job.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          path: .build/ghostty-*
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: fuzz
        run: make fuzz FUZZTIME=${{ inputs.fuzztime || '5m' }}

      # A crasher is written to testdata/fuzz/<Target>/; commit it so it
      # becomes a regression test on every PR.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: pkg-config
        run: command -v pkg-config || brew install pkgconf

      - name: Cache libghostty-vt
        uses: actions/cache@v6
        with:
          path: .build/ghostty-*
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: e2e
        run: make e2e
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # The real-Claude suite (docs/SPEC.md §16.4) needs a logged-in claude,
  # which GitHub-hosted runners don't have. It runs only on a self-hosted
  # runner labelled "claude", and only when the repository variable
  # REALCLAUDE_RUNNER is "true". By hand: make test-claude.
  realclaude:
    if: vars.REALCLAUDE_RUNNER == 'true'
    runs-on: [self-hosted, claude]
    steps:
      - uses: actions/checkout@v5

      - name: test-claude
        run: make test-claude
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-realclaude
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
