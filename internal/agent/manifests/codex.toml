# OpenAI Codex CLI (docs/SPEC.md §8.6, Codex).
#
# Verified against codex-cli 0.160.0 on macOS by the T91 research
# (threads/t-0083/library) and T98. Codex keeps no status file: state
# comes from hooks, the rollout and the screen. The Go agent
# (internal/agent/codex) adds the hooks themselves, with their trust
# hashes, to every launch.

manifest_version = 1
name = "codex"
display = "Codex"

# Read from every hook event, latest wins. Codex's id can't be chosen
# ahead: it is learnt from the first hook, which fires at the first
# prompt (for a thread, the kickoff in argv).
session_field = "session_id"
# Only SessionStart switches to another thread. After /clear the TUI
# keeps the thread it left loaded and unloads it about a minute later
# with SessionEnd (reason "other", the old id), seen live (T105): any
# event naming a thread but the current one is ignored.
session_starts = ["SessionStart"]

[identify]
argv0 = ["codex"]
version_args = ["--version"]
# Information only, never a gate: a newer Codex is supported until
# something breaks, and tm logs the drift it sees (docs/SPEC.md §8.8).
last_tested = "0.162.0"

[launch]
command = "codex"
# `resume <id>` is a subcommand, so it goes first. The flags:
# - no update screen before the prompt;
# - the folder trusted for this run only. Codex keys trust by the main
#   repo's root, even in a linked worktree, and only the inline-table form
#   is honoured (a dotted projects."<dir>".trust_level is not);
# - the brief as developer instructions, which Codex sends again after
#   /clear and /compact (a value, not a file: read here);
# - tm mcp as an MCP server for the thread tools. Codex runs it outside
#   its sandbox with a cleared environment (tm mcp finds the session by
#   its parents), so only TERMINATR_HOME is passed on; its calls must not
#   wait on approvals.
# The coordinator runs with Codex's auto-review (user, 2026-10-07); any
# other session asks: -a on-request (user, 2026-10-08). Codex 0.160's
# default for a session started this way refuses an escalation without
# a dialog (T105), so there was nothing to approve.
args = [
  "{{if .Resume}}resume{{end}}", "{{if .Resume}}{{.AgentSID}}{{end}}",
  "-c", "check_for_update_on_startup=false",
  "-c", 'projects={ {{- toml (or .RepoRoot .Cwd)}}={trust_level="trusted"}}',
  "{{if .BriefPath}}-c{{end}}", "{{if .BriefPath}}developer_instructions={{toml (file .BriefPath)}}{{end}}",
  "-c", "mcp_servers.terminatr.command={{toml .TMBin}}",
  "-c", 'mcp_servers.terminatr.args=["mcp"]',
  "-c", 'mcp_servers.terminatr.env_vars=["TERMINATR_HOME"]',
  "-c", 'mcp_servers.terminatr.default_tools_approval_mode="approve"',
  "{{if and (eq .Role \"coordinator\") (not .Yolo)}}--approve-for-me{{end}}",
  "{{if and (ne .Role \"coordinator\") (not .Yolo)}}-a{{end}}", "{{if and (ne .Role \"coordinator\") (not .Yolo)}}on-request{{end}}",
  # Sandbox (T99, T188).
  # A thread or a coordinator runs in permission profile "tm", the access
  # policy (docs/SPEC.md §5.2) on top of Codex's workspace-write: Read is
  # read, Write is write, NoWrite and NoWriteFiles are read ("deny" would
  # block reading too). A linked worktree's git dirs need write by name:
  # Codex carves git dirs out of every broader grant, and --add-dir and
  # writable_roots don't reopen them. tm.sock needs the network on, which
  # also opens HTTPS (user, 2026-10-07: open for now). Yolo has no
  # sandbox to shape.
  # A coordinator's cwd is the project folder, its Read grant: it is
  # written as write by name rather than left to the tie with the cwd. Its
  # network is the socket only (mode "limited", no domains, enforced by
  # Codex's network proxy, an experimental feature in 0.160: without it
  # "limited" opens everything), so gh and az escalate to auto-review as
  # before and a merge stays reviewed. Its Commands (coordinator_merges)
  # have no equivalent: an execpolicy allow rule doesn't get past the
  # proxy, and allowing the PR host's domain would open all of gh.
  # A newer Codex may rename or change the proxy or this syntax: the Go
  # agent probes the profile before a coordinator starts and drops these
  # flags, with a logged warning, when it doesn't hold (probe.go).
  "{{if and (or (eq .Role \"thread\") (eq .Role \"coordinator\")) (not .Yolo)}}-c{{end}}", "{{if and (or (eq .Role \"thread\") (eq .Role \"coordinator\")) (not .Yolo)}}default_permissions=\"tm\"{{end}}",
  "{{if and (eq .Role \"coordinator\") (not .Yolo)}}-c{{end}}", "{{if and (eq .Role \"coordinator\") (not .Yolo)}}features.network_proxy=true{{end}}",
  "{{if and (eq .Role \"thread\") (not .Yolo)}}-c{{end}}",
  '''{{if and (eq .Role "thread") (not .Yolo)}}permissions={tm={extends=":workspace",filesystem={{pathmodes .Access}},network={enabled=true,unix_sockets={ {{- toml .Socket}}="allow"}}}}{{end}}''',
  "{{if and (eq .Role \"coordinator\") (not .Yolo)}}-c{{end}}",
  '''{{if and (eq .Role "coordinator") (not .Yolo)}}permissions={tm={extends=":workspace",filesystem={{pathmodes .Access .Cwd}},network={enabled=true,mode="limited",unix_sockets={ {{- toml .Socket}}="allow"}}}}{{end}}''',
]
yolo_args = ["--dangerously-bypass-approvals-and-sandbox"]
model_args = ["-m", "{{.Model}}"]
kickoff_args = ["--", "{{.Kickoff}}"]
# What Codex gives the commands it runs: a Codex started from one of them
# must not inherit its thread id or sandbox flags. CODEX_HOME is the
# user's own configuration and stays.
unset_env = ["CODEX_THREAD_ID", "CODEX_SANDBOX", "CODEX_SANDBOX_NETWORK_DISABLED"]

[launch.env]
TERMINATR_SESSION = "{{.SessionID}}"
TERMINATR_SOCKET = "{{.Socket}}"
TERMINATR_BIN = "{{.TMBin}}"

[[models]]
name = "gpt-6-luna"
about = "fast and affordable, everyday coding tasks"
# Passed when no model is chosen: the user's own Codex default may be one
# a ChatGPT login refuses (T158).
default = true

[[models]]
name = "gpt-5.6-terra"
about = "older balanced model for straightforward work"

# The guard (docs/SPEC.md §8.6): Codex's login, in ~/.codex or $CODEX_HOME.
[guard]
secrets = [".codex/auth.json", "$CODEX_HOME/auth.json"]

# The tools the guard judges, by kind, and the input fields each reads:
# the shell's command line, and apply_patch's patch text (its command).
[guard.tools]
Bash = { kind = "shell", fields = ["command"] }
apply_patch = { kind = "patch", fields = ["command"] }

# Prompts go through `codex queue --thread <id> --message <text>` (the
# Go agent's Prompt), paste when it fails. Checked on 0.160 (T100) with
# a live TUI, with and without the shared app-server daemon (0.161)
# running: 20-100 ms, exit 0; the TUI shows it as the user's own prompt
# within seconds when idle; mid-turn it is held, out of sight, and runs
# as its own turn once the turn ends; a draft in the composer stays. A
# queued slash command (/clear) reaches the model as text, so the Go
# agent refuses those and they are pasted. After /clear (/new, /resume,
# /fork) the TUI keeps the old thread loaded and a message queued for it
# runs there, out of sight, while the new thread's id is reported only
# at its first prompt (SessionStart source=clear): the agent pastes until
# then. A /clear typed by hand isn't seen. The queue is durable: a
# message for a thread with no TUI still exits 0 and runs on resume.
[inject]
prompt = "channel"
empty_rule = "idle-empty-box"
# /clear starts over in place; /new first asks where to run.
clear = "/clear"

# Hook payloads are trimmed before they leave the hook process.
[hook]
keep = [
  "session_id", "transcript_path", "cwd", "permission_mode", "source", "reason",
  "tool_name", "tool_use_id", "agent_id", "agent_type", "trigger",
  "prompt", "last_assistant_message",
]
truncate = { prompt = 500, last_assistant_message = 500 }

# The guard judges each tool call from its input: Bash's command, or
# apply_patch's patch text (tool_input.command).
[[hook.keep_when]]
match = { hook_event_name = "PreToolUse" }
fields = ["tool_input"]

# The rollout (~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl): every turn
# starts with task_started and ends with task_complete.
[jsonl_tail]
path_field = "transcript_path"

# Usage (T97, checked on 0.160 rollouts): token_count after each model
# request; last_token_usage.input_tokens counts the cached input too and
# is the context. One turn per task_complete. A subagent writes its own
# rollout, which isn't read. cache_write_input_tokens (0 so far) is left
# out until it is seen whether input counts it.
[jsonl_tail.usage]
match = { type = "event_msg", "payload.type" = "token_count" }
input = "payload.info.last_token_usage.input_tokens"
cache_read = "payload.info.last_token_usage.cached_input_tokens"
output = "payload.info.last_token_usage.output_tokens"
input_includes_cache = true
context = "payload.info.last_token_usage.input_tokens"
context_window = "payload.info.model_context_window"
key = "payload.info.total_token_usage.total_tokens"
# A ChatGPT plan has no dollar cost: the plan limit's use (the primary
# window, 0-100) is shown in its place (T101). The context is the whole
# last request's input over the window; Codex's own "context left"
# takes a 12000-token baseline off both, which isn't done here: the
# hint and auto-/clear want the real fill.
plan_percent = "payload.rate_limits.primary.used_percent"
turn = { type = "event_msg", "payload.type" = "task_complete" }

[[jsonl_tail.rules]]
match = { type = "event_msg", "payload.type" = "task_started" }
state = "working"

[[jsonl_tail.rules]]
match = { type = "event_msg", "payload.type" = "task_complete" }
state = "idle"

[[jsonl_tail.rules]]
match = { type = "event_msg", "payload.type" = "turn_aborted" }
state = "idle"
reason = "interrupted"

# Hook → state. Every event named here is registered with Codex (the Go
# agent writes the hooks); Codex 0.160 knows PreToolUse,
# PermissionRequest, PostToolUse, PreCompact, PostCompact, SessionStart,
# SessionEnd, UserPromptSubmit, SubagentStart, SubagentStop, Stop and
# Interrupt.
[[hooks]]
event = "SessionStart"
state = "idle"
# Fires at the first prompt for startup and resume, and at the next
# prompt after /clear (clear, the new thread) and /compact (compact; seen
# live, T105): the context goes back in every time.
# tm hook waits up to 3 s for the context, not 500 ms (T94).
timeout = "context"
respond = '''{"hookSpecificOutput":{"hookEventName":"SessionStart","additionalContext":{{json .Context}}}}'''

[[hooks]]
event = "UserPromptSubmit"
state = "working"

[[hooks]]
event = "PreToolUse"
state = "working"
transient = true
# The server's guard (internal/guard) judges each call, and a refusal is
# the hook's answer, before any approval (Codex 0.160 honours Claude's
# deny output). Allowed: no output, so Codex's own policy decides.
respond = '''{{with .Guard}}{"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny","permissionDecisionReason":{{json .Message}}}}{{end}}'''

[[hooks]]
event = "PostToolUse"
state = "working"
transient = true

[[hooks]]
event = "PreCompact"
state = "working"
transient = true

# Approvals. A question menu (plan mode) fires no hook: screen only.
[[hooks]]
event = "PermissionRequest"
state = "blocked"
reason = "permission"

[[hooks]]
event = "Stop"
state = "idle"

# Esc on a running turn, or on an approval: the blocked state can't go
# stale.
[[hooks]]
event = "Interrupt"
state = "idle"
reason = "interrupted"

[[hooks]]
event = "SubagentStart"
counter = "+bg"
counter_key = "agent_id"

[[hooks]]
event = "SubagentStop"
counter = "-bg"
counter_key = "agent_id"

# Codex also ends the thread a /clear left with SessionEnd, a minute
# later (reason "other", that thread's id; seen live, T105), maybe
# before the new thread has reported itself. So it sets no state: the
# process's exit says when the session ended.
[[hooks]]
event = "SessionEnd"

# Screen rules (0.160, threads/t-0083/library/T91-codex-screens.md):
# blockers and the screens before the first hook. Highest priority wins.

# Shown when the projects flag didn't cover the folder.
[[rules]]
id = "trust-folder"
state = "blocked"
reason = "trust"
priority = 50
region = "screen"
contains = ["Trust this folder?", "Trust and continue"]

# Shown while any of the user's own hooks is untrusted; tm's hooks are
# trusted for the session. tm answers "Continue without trusting" itself,
# so the user's untrusted hooks don't run in tm sessions (user,
# 2026-10-07).
[[rules]]
id = "hooks-review"
state = "blocked"
reason = "trust"
priority = 50
region = "screen"
contains = ["Hooks need review", "Continue without trusting"]
keys = "3"

# check_for_update_on_startup=false keeps it away; skipped if it shows.
[[rules]]
id = "update-available"
state = "blocked"
reason = "update"
priority = 50
region = "screen"
contains = ["Update available", "Skip until next version"]
keys = "2"

# "Would you like to run the following command?" … "Press enter to
# confirm or esc to cancel". A long command wraps the dialog past any
# fixed height (T105), so only its footer, which is always at the
# bottom, is matched.
[[rules]]
id = "blocked-permission-dialog"
state = "blocked"
reason = "permission"
priority = 40
region = "bottom:4"
contains = ["Press enter to confirm or esc to cancel"]

# request_user_input (plan mode): "Question 1/2 (2 unanswered)". The
# footer says "enter to submit answer", but "enter to submit all" on the
# last of several questions (seen live, T155).
[[rules]]
id = "blocked-question"
state = "blocked"
reason = "question"
priority = 40
region = "bottom:16"
regex = '(?m)^\s*Question \d+/\d+'
contains = ["enter to submit"]

# Free text is the last option, "None of the above" (checked live, 0.160):
# a number submits its option at once, even this one, without notes. So
# Down moves to it, Tab opens the notes, then the words and Enter.
[answer]
rule = "blocked-question"
text_option = "None of the above"
text_focus = "\u001b[B"
text_key = "\t"
submit = "\r"

# A plan-mode turn that ends with a plan asks "Implement this plan?"
# (seen live, T105): Codex waits for the user, no hook says so.
[[rules]]
id = "blocked-plan-implement"
state = "blocked"
reason = "question"
priority = 40
region = "bottom:8"
contains = ["Implement this plan?", "enter select"]

# /new: "Where should the new conversation run?"
[[rules]]
id = "blocked-new-dialog"
state = "blocked"
reason = "question"
priority = 40
region = "bottom:8"
contains = ["Where should the new conversation run?", "enter select"]

# "• Working (3s • esc to interrupt) · 1 background terminal running …"
[[rules]]
id = "working-status"
state = "working"
priority = 20
region = "bottom:12"
regex = '(?m)^• Working \('
contains = ["esc to interrupt"]

# The composer shows "›" with a placeholder or typed text, which may wrap;
# below it a blank row, the model line and "? for shortcuts". It stays
# while a turn runs, and a dialog's selected option also starts with
# "›": the working line and every dialog outrank it.
[[rules]]
id = "idle-composer"
state = "idle"
priority = 0
region = "bottom:8"
regex = '(?m)^› '

# Not a state of its own: the paste injector checks it so it never
# appends to text left in the composer. The placeholder ("Ask Codex to
# do anything") is dim, so the box counts as empty when only it is there.
[[rules]]
id = "idle-empty-box"
state = "idle"
priority = 0
region = "bottom:8"
regex = '(?m)^›\s*$'
skip_dim = true
